name: Bootstrap release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable published release tag to install
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: towbar-production-release
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      DEPLOY_ROLE_ARN: ${{ vars.TOWBAR_DEPLOY_AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.TOWBAR_DEPLOY_AWS_REGION }}
      DEPLOY_INSTANCE_ID: ${{ vars.TOWBAR_DEPLOY_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.TOWBAR_DEPLOY_PATH || '/opt/towbar' }}
      DEPLOY_OWNER: ${{ vars.TOWBAR_DEPLOY_OWNER || 'towbar' }}
      RUNTIME_ENV_SECRET_ID: ${{ vars.TOWBAR_RUNTIME_ENV_SECRET_ID || 'towbar/production/runtime-env' }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      AWS_PAGER: ""

    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate bootstrap configuration
        id: release
        env:
          RUNTIME_ENV: ${{ secrets.TOWBAR_RUNTIME_ENV }}
        run: |
          set -euo pipefail
          : "${DEPLOY_ROLE_ARN:?set TOWBAR_DEPLOY_AWS_ROLE_ARN in the production environment}"
          : "${AWS_REGION:?set TOWBAR_DEPLOY_AWS_REGION in the production environment}"
          : "${DEPLOY_INSTANCE_ID:?set TOWBAR_DEPLOY_INSTANCE_ID in the production environment}"
          : "${RUNTIME_ENV_SECRET_ID:?set TOWBAR_RUNTIME_ENV_SECRET_ID in the production environment}"
          : "${RUNTIME_ENV:?set the TOWBAR_RUNTIME_ENV production environment secret}"

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable semantic version" >&2
            exit 1
          fi
          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == / ]]; then
            echo "TOWBAR_DEPLOY_PATH must be a specific absolute path" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_OWNER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "TOWBAR_DEPLOY_OWNER is invalid" >&2
            exit 1
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e \
            '.draft == false and .prerelease == false and .published_at != null' \
            <<<"$release_json" >/dev/null

          git fetch --force --tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          package_version="$(git show "$RELEASE_TAG:package.json" | jq -r .version)"
          test "$package_version" = "${RELEASE_TAG#v}"
          echo "commit=$release_commit" >>"$GITHUB_OUTPUT"

      # v6.3.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ vars.TOWBAR_DEPLOY_AWS_REGION }}
          role-session-name: towbar-bootstrap-${{ github.run_id }}
          role-to-assume: ${{ vars.TOWBAR_DEPLOY_AWS_ROLE_ARN }}

      - name: Sync managed runtime environment
        env:
          RUNTIME_ENV: ${{ secrets.TOWBAR_RUNTIME_ENV }}
        run: |
          set -euo pipefail
          runtime_env_file="$(mktemp "$RUNNER_TEMP/towbar-runtime-env.XXXXXX")"
          cleanup() {
            rm -f "$runtime_env_file"
          }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$RUNTIME_ENV" >"$runtime_env_file"

          if aws secretsmanager describe-secret \
            --region "$AWS_REGION" \
            --secret-id "$RUNTIME_ENV_SECRET_ID" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value \
              --region "$AWS_REGION" \
              --secret-id "$RUNTIME_ENV_SECRET_ID" \
              --secret-string "file://$runtime_env_file" >/dev/null
          else
            aws secretsmanager create-secret \
              --region "$AWS_REGION" \
              --name "$RUNTIME_ENV_SECRET_ID" \
              --description "Towbar production runtime environment managed by GitHub Actions" \
              --secret-string "file://$runtime_env_file" >/dev/null
          fi
          echo "Updated the encrypted runtime environment handoff"

      - name: Bootstrap exact release through SSM
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          script_base64="$(base64 --wrap=0 infra/bootstrap-release.sh)"
          remote_command="$(
            jq -rn \
              --arg script "$script_base64" \
              --arg tag "$RELEASE_TAG" \
              --arg commit "$RELEASE_COMMIT" \
              --arg path "$DEPLOY_PATH" \
              --arg repository "$REPOSITORY_URL" \
              --arg secret_id "$RUNTIME_ENV_SECRET_ID" \
              --arg region "$AWS_REGION" \
              --arg owner "$DEPLOY_OWNER" \
              '[
                "printf", "%s", ($script | @sh),
                "|", "base64", "--decode",
                "|", "flock", "--nonblock", "/var/lock/towbar-release-deploy.lock",
                "bash", "-s", "--", ($tag | @sh), ($commit | @sh), ($path | @sh),
                ($repository | @sh), ($secret_id | @sh), ($region | @sh), ($owner | @sh)
              ] | join(" ")'
          )"
          parameters="$(
            jq -cn \
              --arg command "$remote_command" \
              '{commands: [$command], executionTimeout: ["3300"]}'
          )"

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$DEPLOY_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Bootstrap Towbar $RELEASE_TAG" \
              --timeout-seconds 3600 \
              --parameters "$parameters" \
              --query Command.CommandId \
              --output text
          )"
          echo "SSM command: $command_id"

          status=Pending
          deadline=$((SECONDS + 3300))
          while ((SECONDS < deadline)); do
            status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$DEPLOY_INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"
            case "$status" in
              Success | Cancelled | TimedOut | Failed | Cancelling) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$DEPLOY_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text || true
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$DEPLOY_INSTANCE_ID" \
            --query StandardErrorContent \
            --output text >&2 || true

          if [[ "$status" != Success ]]; then
            echo "SSM bootstrap finished with status: $status" >&2
            exit 1
          fi

      - name: Verify public health
        env:
          API_HEALTH_URL: ${{ vars.TOWBAR_DEPLOY_API_HEALTH_URL }}
          APP_HEALTH_URL: ${{ vars.TOWBAR_DEPLOY_APP_HEALTH_URL }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ -n "$API_HEALTH_URL" ]]; then
            api_version="$(
              curl --fail --silent --show-error --retry 8 --retry-all-errors \
                --retry-delay 3 "$API_HEALTH_URL" | jq -r .version
            )"
            test "$api_version" = "$RELEASE_COMMIT"
          fi
          if [[ -n "$APP_HEALTH_URL" ]]; then
            curl --fail --silent --show-error --retry 8 --retry-all-errors \
              --retry-delay 3 "$APP_HEALTH_URL" >/dev/null
          fi
