name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SENTRY_ALLOW_MISSING: "true"
          NEXT_PUBLIC_TOWBAR_API_BASE_URL: http://localhost:4020
          NEXT_PUBLIC_TOWBAR_WEBSITE_BASE_URL: https://www.towbar.dev

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure non-production Compose values
        run: |
          cp .env.example .env
          sed -i 's/replace-with-64-random-hex-characters/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/' .env
          sed -i 's/replace-with-different-64-random-hex-characters/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb/' .env
          sed -i 's/replace-with-base64-encoded-32-byte-key/Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=/' .env
          sed -i 's/replace-with-at-least-32-random-characters/dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/' .env
      - run: docker compose config --quiet
      - run: docker compose build
