name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Validate Mintlify configuration
        run: npx --yes mint@4.2.851 validate
        working-directory: docs
      - name: Check Mintlify links and redirects
        run: npx --yes mint@4.2.851 broken-links --check-anchors --check-redirects
        working-directory: docs
      - name: Audit Mintlify accessibility
        run: npx --yes mint@4.2.851 a11y
        working-directory: docs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash -n infra/deploy-release.sh
      - run: shellcheck infra/deploy-release.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SENTRY_ALLOW_MISSING: "true"
          NEXT_PUBLIC_TOWBAR_API_BASE_URL: http://localhost:4020
          NEXT_PUBLIC_TOWBAR_WEBSITE_BASE_URL: https://www.towbar.dev

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure non-production Compose values
        run: |
          cp .env.example .env
          sed -i 's/replace-with-64-random-hex-characters/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/' .env
          sed -i 's/replace-with-different-64-random-hex-characters/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb/' .env
          sed -i 's/replace-with-base64-encoded-32-byte-key/Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=/' .env
          sed -i 's/replace-with-at-least-32-random-characters/dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd/' .env
      - run: docker compose config --quiet
      - run: docker compose build
