name: Publish release images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag, for example v2.0.6
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#v}"
          test "$(jq -r .version package.json)" = "$version"
          commit="$(git rev-parse 'HEAD^{commit}')"
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$tag_commit" = "$commit"
          created="$(git show -s --format=%cI HEAD)"
          {
            echo "commit=$commit"
            echo "created=$created"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: towbar-api
            dockerfile: apps/towbar-api/Dockerfile
          - service: worker
            image: towbar-worker
            dockerfile: apps/towbar-worker/Dockerfile
          - service: web-app
            image: towbar-web-app
            dockerfile: apps/towbar-web-app/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: SOURCE_COMMIT=${{ needs.prepare.outputs.commit }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.commit }}
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          SERVICE: ${{ matrix.service }}
        run: |
          jq -cn \
            --arg service "$SERVICE" \
            --arg image "$IMAGE@$DIGEST" \
            '{service: $service, image: $image}' >"$SERVICE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-image-${{ matrix.service }}
          path: ${{ matrix.service }}.json
          retention-days: 1

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: release-image-*
          path: release-images
          merge-multiple: true
      - name: Create release image manifest
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          jq -s \
            --arg version "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            '{version: $version, commit: $commit, images: (map({key: .service, value: .image}) | from_entries)}' \
            release-images/*.json >towbar-images.json
          jq -e \
            '.images | keys == ["api", "web-app", "worker"] and all(.[]; test("@sha256:[0-9a-f]{64}$"))' \
            towbar-images.json >/dev/null
      - name: Verify anonymous image access
        run: |
          while IFS= read -r image; do
            if ! docker manifest inspect "$image" >/dev/null; then
              echo "::error::Make the GHCR package for $image public, then rerun this job."
              exit 1
            fi
          done < <(jq -r '.images[]' towbar-images.json)
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG"
          fi
      - name: Attach image manifest to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" towbar-images.json --clobber

  publish:
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish assembled release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  local-installation-smoke:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Install the published release locally
        env:
          INSTALLER_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.prepare.outputs.tag }}/install.sh
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/towbar-local-installation"
          mkdir -p "$evidence"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-all-errors \
            --proto '=https' \
            --tlsv1.2 \
            "$INSTALLER_URL" |
            sudo env \
              TOWBAR_INSTALL_URL=http://localhost:4021 \
              TOWBAR_NON_INTERACTIVE=1 \
              TOWBAR_REPOSITORY="$GITHUB_REPOSITORY" \
              bash | tee "$evidence/install.log"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-time 10 \
            http://localhost:4021/health >"$evidence/health.json"
          sudo towbar version | tee "$evidence/version.log"
          grep --fixed-strings "Towbar $RELEASE_TAG" "$evidence/version.log"
          sudo towbar status | tee "$evidence/status.log"
          sudo towbar doctor | tee "$evidence/doctor.log"

      - name: Prove restart reuses the running images
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/towbar-local-installation"
          before="$(sudo towbar compose ps -q api worker web-app | sort)"
          test -n "$before"
          sudo towbar restart | tee "$evidence/restart.log"
          after="$(sudo towbar compose ps -q api worker web-app | sort)"
          test "$after" = "$before"
          test "$(sudo find /opt/towbar/releases -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1

      - name: Withdraw a release that fails installation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release delete "$RELEASE_TAG" --cleanup-tag --yes

      - name: Collect service evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/towbar-local-installation"
          mkdir -p "$evidence"
          if sudo test -x /usr/local/bin/towbar && sudo test -L /opt/towbar/current; then
            sudo towbar compose ps 2>&1 |
              tee "$evidence/final-status.log" >/dev/null || true
            sudo towbar compose logs --no-color 2>&1 |
              tee "$evidence/compose.log" >/dev/null || true
          fi
          docker image ls >"$evidence/docker-images.log" 2>&1 || true
          docker system df >"$evidence/docker-disk.log" 2>&1 || true

      - name: Remove the disposable installation
        if: always()
        run: |
          if sudo test -x /usr/local/bin/towbar && sudo test -L /opt/towbar/current; then
            sudo towbar compose down --volumes --remove-orphans || true
          fi
          sudo rm -rf /opt/towbar /etc/towbar /usr/local/bin/towbar

      - name: Preserve installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-local-installation
          path: ${{ runner.temp }}/towbar-local-installation/
          retention-days: 14
