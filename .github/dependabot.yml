version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Better Auth 1.7 plugins require the 0.4 utilities peer dependency.
      - dependency-name: "@better-auth/utils"
        versions: [">=0.5.0"]
  - package-ecosystem: docker
    directories:
      - /apps/towbar-api
      - /apps/towbar-worker
      - /apps/towbar-web-app
      - /examples
      - /examples/persistent-files
      - /examples/platform-modes/node-app
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
