version: 2
source:
  branch: main
defaults:
  buildServer:
    ip: 192.0.2.20
    transfer: direct
    allowRuntimeFallback: false
apps:
  - id: dockerfile-example
    name: Dockerfile example
    server: 192.0.2.10
    deployment:
      type: dockerfile
      context: examples/platform-modes/node-app
      dockerfile: examples/platform-modes/node-app/Dockerfile
      target: runtime
      architecture: amd64
      cache:
        enabled: true
        scope: platform-dockerfile-example
    container:
      port: 3000
    health:
      path: /health
  - id: static-example
    name: Static example
    server: 192.0.2.10
    deployment:
      type: static
      context: examples/platform-modes/static
      output: dist
      buildCommand: [node, build.mjs]
      architecture: amd64
      cache:
        enabled: true
        scope: platform-static-example
      nodeImage: node:24-alpine@sha256:50c8e8ca1d27439048670df5883f32d57cf81cff6233222c893fd0d9884cbd81
      runtimeImage: nginxinc/nginx-unprivileged@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
      spaFallback: true
      headers:
        Cache-Control: public, max-age=300
        X-Content-Type-Options: nosniff
    container:
      port: 8080
    health:
      path: /
  - id: image-example
    name: Prebuilt image example
    server: 192.0.2.10
    buildServer: null
    deployment:
      type: image
      image: nginxinc/nginx-unprivileged@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
      platform: linux/amd64
    container:
      port: 8080
    health:
      path: /
  - id: railpack-example
    name: Railpack example
    server: 192.0.2.10
    deployment:
      type: railpack
      context: examples/platform-modes/node-app
      version: 0.36.1
      image: ghcr.io/railwayapp/railpack-frontend@sha256:b9166320856c8bbb88789e89077d5a66a7d4cef8afa2e1e232307fb9a92c094e
      configFile: railpack.json
      architecture: amd64
      cache:
        enabled: true
        scope: platform-railpack-example
    container:
      port: 3000
    health:
      path: /health
  - id: nixpacks-example
    name: Nixpacks compatibility example
    server: 192.0.2.10
    deployment:
      type: nixpacks
      context: examples/platform-modes/node-app
      version: 1.41.0
      image: ghcr.io/railwayapp/nixpacks@sha256:9fc9a803373dfdde5b0bab48f26e4d9104f721865d108316eb655ee0214c3e91
      configFile: nixpacks.toml
      architecture: amd64
      cache:
        enabled: true
        scope: platform-nixpacks-example
    container:
      port: 3000
    health:
      path: /health
  - id: buildpack-example
    name: Cloud Native Buildpacks example
    server: 192.0.2.10
    deployment:
      type: buildpack
      context: examples/platform-modes/node-app
      packImage: buildpacksio/pack@sha256:a53c4d6c297e10e680404cffda32e557b79a26d1ee4b7e6b18c0d175cb274621
      builder: heroku/builder@sha256:84d80b3c0d242961414a3c4d0a00c3518e6de01ef936423cfbaf1b0aa0f9155c
      configFile: project.toml
      architecture: amd64
      cache:
        enabled: true
        scope: platform-buildpack-example
    container:
      port: 3000
    health:
      path: /health
compose:
  - id: compose-example
    name: Compose example
    server: 192.0.2.10
    file: examples/platform-modes/compose/compose.yml
    overrides:
      - examples/platform-modes/compose/compose.production.yml
    profiles: [production]
    strategy: maintenance
    services:
      web:
        port: 3000
        domains: [compose.example.com]
        ingress:
          type: proxy
      cache: {}
